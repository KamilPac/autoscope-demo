name: Playwright E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  e2e-p0:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            autosearch-e2e/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install e2e dependencies
        working-directory: autosearch-e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: autosearch-e2e
        run: npx playwright install --with-deps chromium

      - name: Run P0 suite
        working-directory: autosearch-e2e
        env:
          CI: true
          APP_WEB_DIR: ${{ github.workspace }}
        run: npm run test:p0

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-p0
          path: |
            autosearch-e2e/playwright-report
            autosearch-e2e/test-results
          retention-days: 7

  e2e-nightly-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            autosearch-e2e/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install e2e dependencies
        working-directory: autosearch-e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: autosearch-e2e
        run: npx playwright install --with-deps chromium

      - name: Run full suite
        working-directory: autosearch-e2e
        env:
          CI: true
          APP_WEB_DIR: ${{ github.workspace }}
        run: npm run test:all

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-nightly
          path: |
            autosearch-e2e/playwright-report
            autosearch-e2e/test-results
          retention-days: 14
